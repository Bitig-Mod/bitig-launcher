<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <title>Signing in…</title>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <style>body{font-family:sans-serif;margin:32px}</style>
</head>
<body>
Signing in… you can close this tab.
<script>
(function () {
  function parseParams(s) {
    const p = new URLSearchParams(s.startsWith('?') ? s.slice(1) : s);
    const o = {};
    for (const [k, v] of p.entries()) o[k] = v;
    return o;
  }
  const q = location.search && location.search.length > 1 ? parseParams(location.search)
          : location.hash && location.hash.length > 1 ? parseParams(location.hash)
          : {};
  const payload = {
    type: 'ms-auth',
    code: q.code || '',
    state: q.state || '',
    error: q.error || '',
    error_description: q.error_description || ''
  };
  try { window.opener && window.opener.postMessage(payload, window.location.origin); } catch (_) {}
  setTimeout(() => { try { window.close(); } catch(_) {} }, 50);
})();
</script>
</body>
</html>
